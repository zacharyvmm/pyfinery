[project]
name = "pyfinery"
version = "0.1.0"
description = "Validate and query Pydantic models with the Refinery graph solver, and call Refinery from Python (unofficial)"
readme = "README.md"
requires-python = ">=3.12"
license = "EPL-2.0"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
authors = [
    { name = "zacharyvmm", email = "58368863+zacharyvmm@users.noreply.github.com" },
]
keywords = [
    "refinery",
    "graph-solver",
    "model-validation",
    "pydantic",
    "partial-models",
    "model-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "annotated-types>=0.6",
    "httpx>=0.27",
    "pydantic>=2.11",
]

[project.urls]
Documentation = "https://github.com/zacharyvmm/pyfinery#readme"
Issues = "https://github.com/zacharyvmm/pyfinery/issues"
Repository = "https://github.com/zacharyvmm/pyfinery"
Refinery = "https://refinery.tools"
Upstream = "https://github.com/graphs4value/refinery"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that start a real Refinery server in Docker (opt in with PYFINERY_DOCKER_TESTS=1)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
